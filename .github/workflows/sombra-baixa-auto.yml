name: Sombra da baixa automática (relatório)

# Lê `manifesto_baixa_auto_avaliacoes` e imprime um resumo. SOMENTE LEITURA.
#
# POR QUE EXISTE: a fase de sombra (F2) só vale se alguém olhar o que ela produziu, e
# hoje esse dado não é alcançável de lugar nenhum — o Postgres é externo, a
# DATABASE_URL vive só em /opt/apps/torre/.env na VPS, e a tela mostra o veredito de
# UM manifesto por vez, nunca a série. Sem isto, "rodar em sombra por três semanas"
# vira um pedido para ninguém.
#
# POR QUE NÃO É UM "RODE SQL": as consultas são FIXAS, em .github/sql/. Um workflow
# que aceitasse SQL livre seria um backdoor de produção com cara de ferramenta —
# qualquer um que possa disparar Action passaria a poder ler o banco inteiro, e um
# typo de revisão bastaria para escrever. O único input é a janela em horas, validada
# como dígitos e ainda assim passada como VARIÁVEL do psql, não interpolada no SQL.
#
# TRÊS CAMADAS de leitura-apenas, porque a mais externa é a mais fácil de perder numa
# revisão futura: (1) o .sql não tem comando de escrita, (2) ele começa com
# `SET default_transaction_read_only = on`, (3) o psql roda com ON_ERROR_STOP.
#
# RODA NO RUNNER SELF-HOSTED da VPS, único lugar com a credencial. A URL é mascarada
# com ::add-mask:: ANTES de qualquer uso: ela NÃO é secret do Actions, então o GitHub
# não a esconderia sozinho e um erro do psql que a ecoasse vazaria a senha no log.

on:
  workflow_dispatch:
    inputs:
      horas:
        description: 'Janela em horas (padrão 24)'
        required: false
        default: '24'

jobs:
  relatorio:
    name: Resumo da sombra
    runs-on: [self-hosted, torre]
    steps:
      - uses: actions/checkout@v4

      - name: Validar entrada
        id: check
        env:
          HORAS: ${{ inputs.horas }}
        run: |
          set -euo pipefail
          case "${HORAS}" in
            ''|*[!0-9]*) echo "::error::'${HORAS}' nao e um numero inteiro de horas."; exit 1 ;;
          esac
          if [ "${HORAS}" -lt 1 ] || [ "${HORAS}" -gt 2160 ]; then
            echo "::error::janela fora do intervalo 1..2160 horas."; exit 1
          fi
          echo "horas=${HORAS}" >> "$GITHUB_OUTPUT"

      - name: Consultar
        env:
          HORAS: ${{ steps.check.outputs.horas }}
        run: |
          set -euo pipefail
          ENV_FILE=/opt/apps/torre/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE nao encontrado no runner — a credencial vive la (ver deploy.yml)."
            exit 1
          fi
          DB_URL="$(grep -m1 '^DATABASE_URL=' "$ENV_FILE" | cut -d= -f2- | sed -e 's/^"//' -e "s/^'//" -e 's/"$//' -e "s/'$//")"
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL ausente ou vazio em $ENV_FILE"
            exit 1
          fi
          echo "::add-mask::$DB_URL"

          docker run --rm -i \
            -e PGURL="$DB_URL" \
            -e HORAS="$HORAS" \
            postgres:16-alpine \
            sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 -v horas="$HORAS" -f -' \
            < .github/sql/sombra-baixa-auto.sql \
            | tee /tmp/sombra-relatorio.txt

      - name: Resumo
        if: always()
        env:
          HORAS: ${{ inputs.horas }}
        run: |
          set -euo pipefail
          {
            echo "### Sombra da baixa automatica — ultimas ${HORAS}h"
            echo ""
            echo '```'
            cat /tmp/sombra-relatorio.txt 2>/dev/null || echo "(sem saida — ver o log do passo Consultar)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
