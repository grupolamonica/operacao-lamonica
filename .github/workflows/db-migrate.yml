name: DB Migrate (manual)

# Aplica UMA migration .sql de api/drizzle/ no Postgres de produção (Supabase externo).
#
# POR QUE EXISTE: api/drizzle/ tem 13 arquivos .sql aplicados à mão e nenhum mecanismo —
# olhando o repositório ninguém sabe quais já foram aplicados. Este workflow dá um caminho
# auditável (fica no histórico do Actions, com quem disparou e a saída do psql) e dispensa
# alguém carregar a connection string de produção na própria máquina.
#
# RODA NO RUNNER SELF-HOSTED da VPS, único lugar com a credencial: DATABASE_URL vive em
# /opt/apps/torre/.env (provisionado uma vez — ver deploy.yml). A URL é mascarada no log
# com ::add-mask:: ANTES de qualquer uso, porque ela NÃO é secret do Actions e portanto o
# GitHub não a esconderia sozinha.
#
# SEGURO POR PADRÃO — precisa de duas coisas para aplicar de verdade:
#   1. `arquivo` preenchido  (vazio = apenas LISTA as migrations disponíveis e sai)
#   2. `confirmar` == APLICAR (qualquer outra coisa = DRY-RUN: mostra o SQL e sai)
# Só aceita nome de arquivo (basename) dentro de api/drizzle/ — barra e '..' são rejeitados,
# para o input não conseguir apontar para fora da pasta.
#
# As migrations do projeto são escritas de forma aditiva e idempotente (IF NOT EXISTS), então
# reaplicar é inofensivo. Roda em --single-transaction: DDL no Postgres é transacional, logo
# um erro no meio desfaz tudo em vez de deixar meio schema aplicado.
#
# Não substitui o deploy: o deploy NÃO chama este workflow (aplicar schema junto do deploy
# tornaria implícito algo que precisa de decisão humana). Ordem normal: mergear, aplicar aqui,
# depois usar a feature.

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Nome do .sql em api/drizzle/ (ex.: manifesto-tratativas.sql). Vazio = só listar.'
        required: false
        default: ''
      confirmar:
        description: 'Digite APLICAR para executar de verdade. Qualquer outro valor = dry-run.'
        required: false
        default: ''

jobs:
  migrate:
    name: Aplicar migration
    runs-on: [self-hosted, torre]
    steps:
      - uses: actions/checkout@v4

      - name: Listar migrations disponíveis
        run: |
          set -euo pipefail
          echo "===== api/drizzle/ ====="
          ls -1 api/drizzle/*.sql | xargs -n1 basename

      - name: Validar entrada
        id: check
        env:
          ARQUIVO: ${{ inputs.arquivo }}
        run: |
          set -euo pipefail
          if [ -z "${ARQUIVO}" ]; then
            echo "Nenhum arquivo informado — apenas listagem. Nada a aplicar."
            echo "seguir=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # basename only: barra ou '..' sairiam de api/drizzle/
          case "${ARQUIVO}" in
            */*|*..*) echo "::error::'${ARQUIVO}' inválido — informe só o nome do arquivo, sem caminho."; exit 1 ;;
          esac
          case "${ARQUIVO}" in
            *.sql) ;;
            *) echo "::error::'${ARQUIVO}' não termina em .sql"; exit 1 ;;
          esac
          if [ ! -f "api/drizzle/${ARQUIVO}" ]; then
            echo "::error::api/drizzle/${ARQUIVO} não existe neste commit."
            exit 1
          fi
          echo "seguir=true" >> "$GITHUB_OUTPUT"
          echo "Arquivo válido: api/drizzle/${ARQUIVO}"

      - name: Mostrar o SQL que será aplicado
        if: steps.check.outputs.seguir == 'true'
        env:
          ARQUIVO: ${{ inputs.arquivo }}
        run: |
          set -euo pipefail
          echo "===== api/drizzle/${ARQUIVO} ====="
          cat "api/drizzle/${ARQUIVO}"

      - name: Aplicar no Postgres
        if: steps.check.outputs.seguir == 'true' && inputs.confirmar == 'APLICAR'
        env:
          ARQUIVO: ${{ inputs.arquivo }}
        run: |
          set -euo pipefail
          ENV_FILE=/opt/apps/torre/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE não encontrado no runner — a credencial vive lá (ver deploy.yml)."
            exit 1
          fi
          # pega tudo depois do primeiro '=' (a URL pode conter '=' em query params) e
          # remove aspas se o .env estiver com valor citado
          DB_URL="$(grep -m1 '^DATABASE_URL=' "$ENV_FILE" | cut -d= -f2- | sed -e 's/^"//' -e "s/^'//" -e 's/"$//' -e "s/'$//")"
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL ausente ou vazio em $ENV_FILE"
            exit 1
          fi
          # MASCARA ANTES DE USAR: não é secret do Actions, então sem isto um erro do psql
          # que ecoe a connection string vazaria a senha no log público do run.
          echo "::add-mask::$DB_URL"

          echo "Aplicando api/drizzle/${ARQUIVO} …"
          # psql via container: não depende de psql instalado na VPS. A URL entra por env
          # DENTRO do container (não na linha de comando, que apareceria em ps).
          # ON_ERROR_STOP=1 + --single-transaction: erro no meio desfaz tudo.
          docker run --rm -i \
            -e PGURL="$DB_URL" \
            postgres:16-alpine \
            sh -c 'psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -f -' \
            < "api/drizzle/${ARQUIVO}"

          echo "OK — ${ARQUIVO} aplicado."

      - name: Resumo
        if: always()
        env:
          ARQUIVO: ${{ inputs.arquivo }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          set -euo pipefail
          {
            echo "### DB Migrate"
            if [ -z "${ARQUIVO}" ]; then
              echo "Apenas listagem — nenhum arquivo informado."
            elif [ "${CONFIRMAR}" = "APLICAR" ]; then
              echo "Aplicado: \`api/drizzle/${ARQUIVO}\` (por @${GITHUB_ACTOR})"
            else
              echo "DRY-RUN de \`api/drizzle/${ARQUIVO}\` — nada foi executado."
              echo ""
              echo "Para aplicar, rode de novo com **confirmar = APLICAR**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
